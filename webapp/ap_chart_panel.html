<style>
/* 序列概览：五个序列一行显示，明细（变化/最高/最低/均值）放到悬停提示里 */
.ap-series-row {{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 20px;
  margin-bottom: 8px;
  font-size: 14px;
  color: {series_text};
  text-shadow: {series_shadow};
}}
.ap-series-item {{
  position: relative;
  white-space: nowrap;
  cursor: default;
}}
.ap-series-item:hover::after {{
  content: attr(data-tip);
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 40;
  padding: 6px 10px;
  border-radius: 10px;
  border: 1px solid {tip_border};
  background: {tip_bg};
  color: {tip_text};
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-line;
  box-shadow: {tip_shadow};
  pointer-events: none;
}}
/* 图例行：左侧时间范围按钮、中间序列图例、最右侧「重置图表」。
   按钮由 PyWebIO 的 put_scope 生成、DOM 上排在面板末尾，渲染后由 JS 搬进
   本行（见 ap_chart.js 的 movePeriodSelectorToLegend），这里只负责排布。
   时间范围按钮靠左、重置按钮靠右：给 .ap-legend-actions 加 margin-left:auto
   把两者分开，中间留给图例。 */
.ap-legend-row {{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  min-height: 30px;
  margin-bottom: 6px;
  font-size: 12px;
  color: {legend_text};
}}
.ap-legend-row > [id$="_legend"] {{
  flex: 1 1 auto;
  min-width: 0;
}}
.ap-legend-actions {{
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 0 0 auto;
  margin-left: auto;
}}
</style>
<div class="ap-chart-panel">
  <div style="margin-top:10px; margin-bottom:6px;">
    <div style="font-weight:600; font-size:1rem; margin-bottom:6px;">体力变化 - {view_title}</div>
    <div class="ap-series-row">
      <span class="ap-series-item" data-tip="变化: {change_sign}{ap_change:,}（总行动力）&#10;最高: {ap_max:,}&#10;最低: {ap_min:,}&#10;均值: {ap_avg:,}">行动力: <b style="color:{ap_color}">({ap_now_cur:,}) {ap_cur:,}</b></span>
      {coins_stats_html}
    </div>
  </div>
  <div class="ap-legend-row">
    <div class="ap-legend-actions" id="{chart_id}_period_slot"></div>
    <div id="{chart_id}_legend" style="display:flex; flex-wrap:wrap; align-items:center; gap:12px;">
      <span class="ap-legend-item" data-series="0" style="display:flex; align-items:center; gap:4px;cursor:pointer;opacity:1;"><span style="width:12px; height:3px; background:{ap_color}; border-radius:1px;"></span>体力</span>
      {coins_legend_html}
    </div>
    <div class="ap-legend-actions">
      <button id="{chart_id}_reset" class="alas-chart-reset">{reset_chart_label}</button>
    </div>
  </div>
  <div id="{chart_id}_container" style="position:relative;background:{chart_bg};border-radius:16px;border:1px solid {panel_border};box-shadow:{panel_shadow};padding:6px;transition:opacity 0.3s ease;">
    <canvas id="{chart_id}" style="width:100%;height:clamp(260px, 34vh, 360px);display:block;cursor:crosshair;"></canvas>
    <canvas id="{chart_id}_ov"
      style="position:absolute;top:6px;left:6px;width:calc(100% - 12px);height:clamp(260px, 34vh, 360px);pointer-events:none;"></canvas>
    <div id="{chart_id}_tip"
      style="display:none;position:absolute;pointer-events:none;background:{tip_bg};border:1px solid {tip_border};border-radius:12px;padding:8px 12px;font-size:12px;color:{tip_text};box-shadow:{tip_shadow};z-index:10;white-space:nowrap;">
    </div>
  </div>
</div>
